swagger: "2.0"
info:
  title: Legacy Petstore
  version: "2"
host: legacy.petstore.test
basePath: /v2
schemes: [https]
securityDefinitions:
  key:
    type: apiKey
    in: header
    name: X-API-Key
paths:
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
