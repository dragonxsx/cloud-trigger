image:
  repository: ghcr.io/banana-inc/cloud-trigger
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Split roles to scale them independently, or set `combined.enabled: true` for one Deployment.
combined:
  enabled: false
  replicas: 2
roles:
  api:
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
  scheduler:
    # Safe to run >1: due jobs are claimed with leases and fires are deduplicated.
    replicas: 2
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  worker:
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 192Mi }, limits: { memory: 512Mi } }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  consumer:
    # Polls queue event sources (SQS, Kafka, NATS). SQS sources are leased to one replica;
    # Kafka groups and JetStream durables spread work across replicas.
    replicas: 2
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

config:
  # mongo (default) or postgres. Set MONGO_URI or POSTGRES_URL under secrets accordingly.
  DB_DRIVER: mongo
  POSTGRES_MAX_CONNECTIONS: "10"
  MONGO_DB: cloud_trigger
  LOG_LEVEL: info
  WORKER_CONCURRENCY: "16"
  LEASE_MS: "30000"
  NOTIFY_TIMEOUT_MS: "10000"
  NOTIFY_MAX_ATTEMPTS: "5"
  SLA_INTERVAL_MS: "5000"
  CONSUMER_INTERVAL_MS: "5000"
  CONSUMER_LEASE_MS: "30000"
  WEBHOOK_MAX_PER_SECOND: "20"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  DECISION_RETENTION_DAYS: "14"
  BADGES_PUBLIC: "false"
  PUBLIC_URL: ""
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URI: ""
  OIDC_CLIENT_ID: ""
  OIDC_UI_SCOPE: ""
  ANONYMOUS_SCOPES: ""

# Sensitive settings. Prefer `existingSecret` in production (e.g. managed by External Secrets).
secrets:
  existingSecret: ""
  values:
    MONGO_URI: ""
    POSTGRES_URL: ""
    API_KEYS: ""
    CALENDAR_TOKEN_SECRET: ""

# Job-level secrets referenced as {{secret:NAME}}; mounted as files under /var/run/secrets/cloud-trigger.
jobSecrets:
  existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: cloud-trigger.example.com
  tls: []

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}

# OpenTelemetry: set config.OTEL_EXPORTER_OTLP_ENDPOINT (e.g. http://otel-collector:4318) to export a span per run.

# Throwaway in-cluster dependencies for demos and evaluation. Do not use in production.
demo:
  # Set config.DB_DRIVER=postgres too; POSTGRES_URL is filled in when secrets.values.POSTGRES_URL is empty.
  postgres:
    enabled: false
    image: postgres:18-alpine
  # SQS, SNS and EventBridge at http://<release>-localstack:4566 for the AWS targets and the sqs trigger.
  localstack:
    enabled: false
    image: localstack/localstack:4.14
  # A single-node KRaft broker at <release>-kafka:9092 for the kafka target and trigger.
  kafka:
    enabled: false
    image: apache/kafka:4.1.0
