image:
  repository: ghcr.io/banana-inc/cloud-trigger
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Split roles to scale them independently, or set `combined.enabled: true` for one Deployment.
combined:
  enabled: false
  replicas: 2
roles:
  api:
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
  scheduler:
    # Safe to run >1: due jobs are claimed with leases and fires are deduplicated.
    replicas: 2
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  worker:
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 192Mi }, limits: { memory: 512Mi } }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  consumer:
    # Polls queue event sources (SQS, Kafka, NATS). SQS sources are leased to one replica;
    # Kafka groups and JetStream durables spread work across replicas.
    replicas: 2
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

config:
  # mongo (default) or postgres. Set MONGO_URI or POSTGRES_URL under secrets accordingly.
  DB_DRIVER: mongo
  POSTGRES_MAX_CONNECTIONS: "10"
  MONGO_DB: cloud_trigger
  LOG_LEVEL: info
  WORKER_CONCURRENCY: "16"
  LEASE_MS: "30000"
  NOTIFY_TIMEOUT_MS: "10000"
  NOTIFY_MAX_ATTEMPTS: "5"
  SLA_INTERVAL_MS: "5000"
  CONSUMER_INTERVAL_MS: "5000"
  CONSUMER_LEASE_MS: "30000"
  WEBHOOK_MAX_PER_SECOND: "20"
  # OpenTelemetry. Set an OTLP endpoint (e.g. http://otel-collector:4318) to export traces, metrics
  # and logs; /metrics is served either way. Auth headers belong in secrets.values.OTEL_EXPORTER_OTLP_HEADERS.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_PROTOCOL: ""   # http/protobuf (default), http/json or grpc
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""    # per-signal full URLs override the endpoint above
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ""    # per-signal protocols override the protocol above
  OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: ""
  OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: ""
  OTEL_SERVICE_NAME: ""             # default cloud-trigger, unless OTEL_RESOURCE_ATTRIBUTES sets service.name
  OTEL_RESOURCE_ATTRIBUTES: ""      # e.g. deployment.environment.name=prod
  OTEL_TRACES_EXPORTER: ""          # otlp (default), console or none
  OTEL_METRICS_EXPORTER: ""
  OTEL_METRIC_EXPORT_INTERVAL: ""   # ms between OTLP metric pushes, default 60000
  OTEL_LOGS_EXPORTER: ""
  OTEL_TRACES_SAMPLER: ""           # e.g. parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG
  OTEL_TRACES_SAMPLER_ARG: ""
  OTEL_NODE_ENABLED_INSTRUMENTATIONS: ""    # e.g. http,express,undici; without either list fs, dns and net are off
  OTEL_NODE_DISABLED_INSTRUMENTATIONS: ""
  OTEL_SDK_DISABLED: ""             # true: no instrumentation or export; /metrics keeps working
  RUN_RETENTION_DAYS: "30"
  DECISION_RETENTION_DAYS: "14"
  BADGES_PUBLIC: "false"
  OPENAPI_FETCH_ALLOW_PRIVATE: "false"
  PUBLIC_URL: ""

# Sensitive settings. Prefer `existingSecret` in production (e.g. managed by External Secrets).
secrets:
  existingSecret: ""
  values:
    MONGO_URI: ""
    POSTGRES_URL: ""
    CALENDAR_TOKEN_SECRET: ""
    # Required: `openssl rand -base64 32`. Encrypts stored secrets; back it up.
    DATA_ENCRYPTION_KEY: ""
    # Retired keys during rotation, comma-separated.
    DATA_ENCRYPTION_PREVIOUS_KEYS: ""
    # First-run /setup token; set it when running more than one API replica.
    SETUP_TOKEN: ""
    # OTLP auth for a hosted backend, e.g. "authorization=Basic <token>" or "x-honeycomb-team=<key>".
    OTEL_EXPORTER_OTLP_HEADERS: ""

# Job-level secrets referenced as {{secret:NAME}}; mounted as files under /var/run/secrets/cloud-trigger.
jobSecrets:
  existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: cloud-trigger.example.com
  tls: []

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}

# Throwaway in-cluster dependencies for demos and evaluation. Do not use in production.
demo:
  # Set config.DB_DRIVER=postgres too; POSTGRES_URL is filled in when secrets.values.POSTGRES_URL is empty.
  postgres:
    enabled: false
    image: postgres:18-alpine
  # SQS, SNS and EventBridge at http://<release>-localstack:4566 for the AWS targets and the sqs trigger.
  localstack:
    enabled: false
    image: localstack/localstack:4.14
  # A single-node KRaft broker at <release>-kafka:9092 for the kafka target and trigger.
  kafka:
    enabled: false
    image: apache/kafka:4.1.0
