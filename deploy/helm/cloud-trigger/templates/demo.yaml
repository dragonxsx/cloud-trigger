{{- define "ct.demo" -}}
{{- $root := .root -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ct.fullname" $root }}-{{ .name }}
  labels: {{- include "ct.labels" $root | nindent 4 }}
    app.kubernetes.io/component: demo-{{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: demo-{{ .name }}
  template:
    metadata:
      labels: {{- include "ct.labels" $root | nindent 8 }}
        app.kubernetes.io/component: demo-{{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          {{- with .args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          env: {{- toYaml .env | nindent 12 }}
          ports:
            - { name: main, containerPort: {{ .port }} }
          {{- if .volumePath }}
          volumeMounts:
            - { name: data, mountPath: {{ .volumePath }} }
          {{- end }}
      {{- if .volumePath }}
      volumes:
        - { name: data, emptyDir: {} }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ct.fullname" $root }}-{{ .name }}
  labels: {{- include "ct.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: demo-{{ .name }}
  ports:
    - { name: main, port: {{ .port }}, targetPort: main }
{{- end }}
{{- if .Values.demo.postgres.enabled }}
---
{{ include "ct.demo" (dict "root" $ "name" "postgres" "image" .Values.demo.postgres.image "port" 5432 "volumePath" "/var/lib/postgresql" "env" (list (dict "name" "POSTGRES_USER" "value" "cloud") (dict "name" "POSTGRES_PASSWORD" "value" "cloud") (dict "name" "POSTGRES_DB" "value" "cloud_trigger"))) }}
{{- end }}
{{- if .Values.demo.localstack.enabled }}
---
{{ include "ct.demo" (dict "root" $ "name" "localstack" "image" .Values.demo.localstack.image "port" 4566 "env" (list (dict "name" "SERVICES" "value" "sqs,sns,events"))) }}
{{- end }}
{{- if .Values.demo.kafka.enabled }}
{{- $kafka := printf "%s-kafka" (include "ct.fullname" .) }}
---
{{ include "ct.demo" (dict "root" $ "name" "kafka" "image" .Values.demo.kafka.image "port" 9092 "env" (list (dict "name" "KAFKA_NODE_ID" "value" "1") (dict "name" "KAFKA_PROCESS_ROLES" "value" "broker,controller") (dict "name" "KAFKA_LISTENERS" "value" "PLAINTEXT://:9092,CONTROLLER://:9093") (dict "name" "KAFKA_ADVERTISED_LISTENERS" "value" (printf "PLAINTEXT://%s:9092" $kafka)) (dict "name" "KAFKA_CONTROLLER_LISTENER_NAMES" "value" "CONTROLLER") (dict "name" "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP" "value" "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT") (dict "name" "KAFKA_CONTROLLER_QUORUM_VOTERS" "value" "1@localhost:9093") (dict "name" "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR" "value" "1"))) }}
{{- end }}
