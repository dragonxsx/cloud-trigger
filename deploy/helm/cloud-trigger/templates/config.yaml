apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ct.fullname" . }}-config
  labels: {{- include "ct.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ct.secretName" . }}
  labels: {{- include "ct.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
