apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ct.fullname" . }}-config
  labels: {{- include "ct.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ct.secretName" . }}
  labels: {{- include "ct.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.demo.postgres.enabled (not .Values.secrets.values.POSTGRES_URL) }}
  POSTGRES_URL: {{ printf "postgres://cloud:cloud@%s-postgres:5432/cloud_trigger" (include "ct.fullname" .) | quote }}
  {{- end }}
{{- end }}
