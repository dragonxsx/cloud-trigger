name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm outdated -r || true

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: cloud-trigger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image on SQLite
        run: |
          docker run -d --name ct -p 8080:8080 -e DB_DRIVER=sqlite \
            -e DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)" cloud-trigger:ci
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/live; then exit 0; fi
            sleep 1
          done
          docker logs ct
          exit 1
